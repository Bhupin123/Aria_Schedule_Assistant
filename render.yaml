services:
  - type: web
    name: scheduling-assistant-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile
      - key: DATABASE_URL
        value: sqlite+aiosqlite:////tmp/scheduling.db
      - key: CHECKPOINT_DB_URL
        value: /tmp/checkpoints.db
      - key: ALLOWED_ORIGINS
        sync: false
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM_NAME
        value: Scheduling Assistant
      - key: DEBUG
        value: "false"
      - key: LOG_LEVEL
        value: INFO
      - key: APP_VERSION
        value: 1.0.0
      - key: MAX_TURNS
        value: "20"
      - key: MAX_ACTIVE_BOOKINGS_PER_EMAIL
        value: "5"
      - key: BOOKING_WINDOW_DAYS
        value: "90"
      - key: PYTHON_VERSION
        value: "3.11"